server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location ~ ^/api(/|$) {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
